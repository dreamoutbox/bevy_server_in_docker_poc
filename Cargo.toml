[package]
name = "bevy_server_in_docker_poc"
version = "0.1.0"
edition = "2024"

[features]
# Enable both modes locally; Docker builds with `--no-default-features --features server`
# to avoid compiling or linking any GUI, audio, or windowing dependencies.
default = ["client", "server"]
server = []
client = ["bevy/ui"]

[dependencies]
bevy = { version = "0.20.1", default-features = false, features = [
    "std",
    "async_executor",
    "multi_threaded",
    "bevy_log",
] }
bevy_renet = "6.0.0"
clap = { version = "4.6", features = ["derive", "env"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
